<div class="fixed inset-0 bg-gray-700/80 flex items-center justify-center z-50">
  <div class="bg-white rounded-xl w-full max-w-xl shadow-lg">
    <div class="px-10 py-8">
      <p class="text-lg text-gray-900">
        ¿Estás seguro de eliminar el producto <strong>{{ title }}</strong
        >?
      </p>

      <input
        type="text"
        placeholder="Escribe el nombre del producto para confirmar"
        class="mt-4 w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400"
        [(ngModel)]="typedValue"
      />
    </div>

    <div class="h-px bg-gray-100"></div>

    <div class="flex justify-center gap-6 px-10 py-6">
      <button
        class="px-8 py-2 rounded-md bg-gray-100 text-gray-700 font-medium hover:bg-gray-200"
        (click)="onCancel()"
      >
        Cancelar
      </button>

      <button
        class="px-8 py-2 rounded-md bg-yellow-200 text-yellow-900 font-medium hover:bg-yellow-300 disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="typedValue.trim() !== title"
        (click)="onConfirm()"
      >
        Confirmar
      </button>
    </div>
  </div>
</div>
